# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Render asks for the values marked sync: false.
services:
  - type: web
    name: clinic-mascotas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string, ending in /clinic_mascotas
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
