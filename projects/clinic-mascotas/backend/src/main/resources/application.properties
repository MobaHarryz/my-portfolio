spring.application.name=clinic-mascotas-api

# --- MongoDB ---
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clinic_mascotas}
spring.data.mongodb.auto-index-creation=true

# --- Server ---
server.port=${PORT:8080}
server.error.include-message=never

# --- Actuator: only expose health ---
management.endpoints.web.exposure.include=health

# --- Clinic settings ---
app.clinic.name=Clinic Mascotas
app.clinic.email=info@clinicmascotas.co
app.clinic.phone=+57 319 225 6982
# .properties files are read as ISO-8859-1: write accents as unicode escapes (escape non-ASCII characters)
app.clinic.address=Cra. 43A #1-50, El Poblado, Medell\u00edn
app.clinic.maps-url=https://maps.google.com/?q=El+Poblado+Medellin
app.clinic.consultation-price=8000
app.clinic.currency=COP
app.clinic.time-zone=America/Bogota
app.clinic.booking-days-ahead=21

# --- Security ---
# Comma separated list of origins allowed to call the API (the Angular app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# HS256 signing key, at least 32 characters. ALWAYS override in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=480
# Initial admin account, created on first start if no admin exists
app.admin.email=${ADMIN_EMAIL:admin@clinicmascotas.co}
app.admin.password=${ADMIN_PASSWORD:Admin123*}
app.admin.name=Administrador
# Load demo veterinarians on first start
app.seed.demo-data=${SEED_DEMO_DATA:true}
